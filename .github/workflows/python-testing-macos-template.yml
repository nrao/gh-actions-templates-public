name: "Python testing on MacOS (template)"

on:
  workflow_call:
    inputs:
      python-versions:
        required: false
        type: string
        default: '["3.11", "3.12", "3.13"]' 
      test-path:
        required: false
        type: string
        default: "tests/"
      xcode-version:
        description: >-
          If set (e.g. "16"), select this Xcode version so the build uses a
          recent Apple Clang (astroviper needs Apple Clang >= 16 for its C++23
          extensions). Empty = use the runner's default Xcode (unchanged
          behaviour for pure-Python projects).
        required: false
        type: string
        default: ""

jobs:
  build:
    name: macos (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest"]
        python-version: ${{ fromJson(inputs.python-versions) }}
    steps:
      - name: Keep alive
        run: |
          while true; do echo "Still running..."; sleep 300; done &
      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: test
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict

      - name: Ensure pip is installed
        run: |
          conda install -n test pip -y
          python -m pip --version

      # 📌 Pin libboost-python, to avoid not finding libboost_graph.dylib error
      - name: Pin boost version
        run: conda install libboost-python=1.86.0

      - run: conda install python-casacore
      
      - uses: actions/checkout@v4
      
      - name: Select Xcode ${{ inputs.xcode-version }}
        if: ${{ inputs.xcode-version != '' }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version }}

      - name: Install dependencies with pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[all]"
          
      - name: Test with pytest
        run: pytest ${{ inputs.test-path }}
