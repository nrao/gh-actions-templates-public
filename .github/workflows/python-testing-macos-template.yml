name: "Python testing on MacOS (template)"

on:
  workflow_call:
    inputs:
      python-versions:
        required: false
        type: string
        default: '["3.11", "3.12", "3.13"]' 
      test-path:
        required: false
        type: string
        default: "tests/"

jobs:
  build:
    name: macos (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest"]
        python-version: ${{ fromJson(inputs.python-versions) }}
    steps:
      - name: Keep alive
        run: |
          while true; do echo "Still running..."; sleep 300; done &

      - name: Set trace-start
        run: |
          echo "trace-start=$(date +%s)" >> $GITHUB_OUTPUT
      - uses: honeycombio/gha-buildevents@v2
        with:
          apikey: ${{ secrets.BUILDEVENT_APIKEY }}
          dataset: gha-buildevents_integration
          matrix-key: python-version

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: test
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict

      # 📌 Pin libboost-python, to avoid not finding libboost_graph.dylib error
      - name: Pin boost version
        run: |
          echo "STEP_ID=pin boost" >> $GITHUB_ENV
          echo "STEP_START=$(date +%s)" >> $GITHUB_ENV
          source $GITHUB_ENV
          buildevents cmd $TRACE_ID $STEP_ID $STEP_ID -- \
            conda install libboost-python=1.86.0

      - run: |
          echo "STEP_ID=install casacore" >> $GITHUB_ENV
          echo "STEP_START=$(date +%s)" >> $GITHUB_ENV
          source $GITHUB_ENV
          buildevents cmd $TRACE_ID $STEP_ID $STEP_ID -- \
            conda install python-casacore
      
      - uses: actions/checkout@v4
      
      - name: Install dependencies with pip
        run: |
          echo "STEP_ID=pip" >> $GITHUB_ENV
          echo "STEP_START=$(date +%s)" >> $GITHUB_ENV
          source $GITHUB_ENV
          buildevents cmd $TRACE_ID $STEP_ID "self update" -- \
            python -m pip install --upgrade pip
          buildevents cmd $TRACE_ID $STEP_ID "install package" -- \
            python -m pip install ".[all]"
          buildevents step $TRACE_ID $STEP_ID $STEP_START $STEP_ID

      - name: Test with pytest
        run: |
          echo "STEP_ID=pytest" >> $GITHUB_ENV
          echo "STEP_START=$(date +%s)" >> $GITHUB_ENV
          source $GITHUB_ENV
          buildevents cmd $TRACE_ID $STEP_ID 'run tests' -- \
            pytest ${{ inputs.test-path }}

    outputs:
      trace-start: ${{ steps.set-trace-start.outputs.trace-start }}

  end-trace:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ always() }}
    permissions:
      actions: read
    steps:
    - uses: technote-space/workflow-conclusion-action@v3
    - uses: honeycombio/gha-buildevents@v2
      with:
        apikey: ${{ secrets.BUILDEVENT_APIKEY }}
        dataset: gha-buildevents_integration
        status: ${{ env.WORKFLOW_CONCLUSION }}
        trace-start: ${{ needs.build.outputs.trace-start}}
        matrix-key: ${{ matrix.python-version }}
