# Reusable workflow: run a package's pytest suite on macOS (arm64), with
# Python from actions/setup-python and the dependencies from pip. casacore
# table access comes from pip wheels too (XRADIO's arcae backend), so no conda
# environment is needed.
#
# The VIPER repositories call this on pull requests and on pushes to main only.

name: "Python testing on MacOS (template)"

on:
  workflow_call:
    inputs:
      python-versions:
        description: >-
          JSON list of Python versions to test. The VIPER repositories pass
          '["3.12", "3.13", "3.14"]'.
        required: false
        type: string
        default: '["3.11", "3.12", "3.13"]'
      test-path:
        required: false
        type: string
        default: "tests/"
      xcode-version:
        description: >-
          If set (e.g. "16"), select this Xcode version so the build uses a
          recent Apple Clang (astroviper needs Apple Clang >= 16 for its C++23
          extensions). Empty = use the runner's default Xcode (unchanged
          behaviour for pure-Python projects).
        required: false
        type: string
        default: ""
      fortran-compiler:
        description: >-
          If set (e.g. "gfortran-14"), export FC as the full path of this
          compiler so CMake finds a Fortran compiler (the macOS runners ship
          Homebrew GCC as gfortran-N, without a bare `gfortran`). Empty = no
          Fortran compiler is configured.
        required: false
        type: string
        default: ""
      ignore-requires-python:
        description: >-
          Temporary: run pip with --ignore-requires-python (via
          PIP_IGNORE_REQUIRES_PYTHON) so a new Python version can be tested
          before sibling packages on PyPI have been re-released with a relaxed
          Requires-Python cap. Turn off once they have been.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: macos (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest"]
        python-version: ${{ fromJson(inputs.python-versions) }}
    steps:
      - name: Keep alive
        run: |
          while true; do echo "Still running..."; sleep 300; done &
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Select Xcode ${{ inputs.xcode-version }}
        if: ${{ inputs.xcode-version != '' }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version }}

      - name: Use Fortran compiler ${{ inputs.fortran-compiler }}
        if: ${{ inputs.fortran-compiler != '' }}
        env:
          FORTRAN_COMPILER: ${{ inputs.fortran-compiler }}
        run: |
          FC_PATH=$(command -v "$FORTRAN_COMPILER") || { echo "::error::Fortran compiler '$FORTRAN_COMPILER' not found on PATH"; exit 1; }
          "$FC_PATH" --version
          echo "FC=$FC_PATH" >> "$GITHUB_ENV"

      - name: Ignore Requires-Python caps (temporary)
        if: ${{ inputs.ignore-requires-python }}
        run: |
          echo "::warning::pip is ignoring Requires-Python in this job (ignore-requires-python: true). Remove once sibling packages are re-released."
          echo "PIP_IGNORE_REQUIRES_PYTHON=1" >> "$GITHUB_ENV"

      - name: Install dependencies with pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[all]"

      - name: Test with pytest
        run: pytest ${{ inputs.test-path }}
