# Reusable workflow: build a pure-Python package (sdist + py3-none-any wheel)
# and, for tag refs (e.g. a GitHub release), upload it to PyPI.
# For more information see: https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
#
# Same as python-publish-cngi-template.yml, kept for existing callers that use
# `secrets: inherit` instead of passing PYPI_TOKEN explicitly. Its metadata
# check is not --strict (an existing caller has no long_description).

name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

on:
  workflow_call:
    inputs:
      pypi-url:
        required: true
        type: string
    secrets:
      PYPI_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install pypa/build and twine
      run: python -m pip install --upgrade pip build twine
    - name: Build a source distribution and wheel
      run: python -m build
    - name: Check the distribution metadata
      run: python -m twine check dist/*
    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ inputs.pypi-url }}

    steps:
    - name: Check PYPI_TOKEN is set
      env:
        PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      run: |
        if [ -z "$PYPI_TOKEN" ]; then
          echo "PYPI_TOKEN is EMPTY"
          exit 1
        else
          echo "PYPI_TOKEN is SET"
        fi

    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: "__token__"
        password: ${{ secrets.PYPI_TOKEN }}  # Using your pre-generated PyPI token from GitHub secrets
