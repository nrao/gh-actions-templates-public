# Reusable workflow: run a package's pytest suite on Linux and macOS with
# casatools installed in place of python-casacore, and upload coverage and
# test results to Codecov.
#
# casatools only publishes wheels for some Python versions (6.7.0.x: cp310-
# cp312; 6.7.6.x: cp312 and cp313; none for 3.14), so pick python-versions to
# match casatools-version.

name: "Python testing with casatools on Linux/macOS (template)"

on:
  workflow_call:
    inputs:
      python-versions:
        description: >-
          JSON list of Python versions. Each must have a casatools wheel for
          the requested casatools-version.
        required: false
        type: string
        default: '["3.11", "3.12"]'
      casatools-version:
        description: >-
          pip version specifier appended to "casatools", e.g. "==6.7.0.31".
          Empty = latest release.
        required: false
        type: string
        default: ""
      test-path:
        required: false
        type: string
        default: "tests/"
      cov_project:
        required: true
        type: string
      pytest_ignore:
        description: Path passed to pytest --ignore. Empty = ignore nothing.
        required: false
        type: string
        default: ""
    secrets:
      CODECOV_TOKEN:
        # Optional so pull requests from forks (which receive no secrets) can
        # still run.
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ${{ fromJson(inputs.python-versions) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-activate: false
          activate-environment: test

          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          use-only-tar-bz2: true
          show-channel-urls: true
          miniforge-version: latest

      - name: Install dependencies with pip
        env:
          CASATOOLS_VERSION: ${{ inputs.casatools-version }}
        run: |
          python -m pip install --upgrade pip
          # install the current package
          pip install ".[all]"
          pip uninstall python-casacore -y
          pip install "casatools${CASATOOLS_VERSION}"
          # trigger `casa-data` fetch
          mkdir -p ~/.casa/data && python -c 'import casatools'

      - name: Test with pytest
        env:
          SKIP_TESTS_CASATOOLS: "1"  # Skip tests that require casatasks
          PYTEST_IGNORE: ${{ inputs.pytest_ignore }}
        run: |
          IGNORE_ARGS=()
          if [ -n "$PYTEST_IGNORE" ]; then
            IGNORE_ARGS=(--ignore="$PYTEST_IGNORE")
          fi
          pytest -v ${{ inputs.test-path }} \
          "${IGNORE_ARGS[@]}" \
          --html=test-results.html --self-contained-html \
          --cov=${{ inputs.cov_project }} --no-cov-on-fail \
          --cov-report=html --cov-report=xml --doctest-modules \
          --junitxml=junit.xml -o junit_family=legacy

      - name: Upload pytest test results and coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ matrix.os }}-${{ matrix.python-version }}-with-casatools
          path: |
            ./test-results.html
            ./htmlcov
        # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}

      - name: Upload code coverage results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}

      - name: Upload test stats to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          report_type: test_results
          files: ./junit.xml
