name: Python Testing Integration Template

# Installs ToolVIPER, XRADIO, GraphVIPER and AstroVIPER together (the calling
# repository's checkout replaces its own entry) and runs every package's tests.
# On a push to main it then sends a repository_dispatch to casangi/testviper.
#
# Example:
# jobs:
#   test-with-specific-branches:
#     uses: nrao/gh-actions-templates-public/.github/workflows/python-testing-integration-template.yml@main
#     with:
#       toolviper_ref: 'v1.0.0' #optional, default main
#       xradio_ref: 'dev' #optional, default main
#       graphviper_ref: 'release-candidate' #optional, default main
#       astroviper_ref: 'main' #optional, default main
#     secrets:
#       TESTVIPER_DISPATCH_TOKEN: ${{ secrets.TESTVIPER_DISPATCH_TOKEN }}

on:
  workflow_call:
    inputs:
      toolviper_ref:
        description: "Branch or tag for ToolVIPER"
        required: false
        default: "main"
        type: string
      xradio_ref:
        description: "Branch or tag for XRADIO"
        required: false
        default: "main"
        type: string
      graphviper_ref:
        description: "Branch or tag for GraphVIPER"
        required: false
        default: "main"
        type: string
      astroviper_ref:
        description: "Branch or tag for AstroVIPER"
        required: false
        default: "main"
        type: string
      python-versions:
        description: >-
          JSON list of Python versions to run the integration suite on. One
          version by default: the per-repo Linux/macOS workflows cover the
          full 3.12-3.14 matrix.
        required: false
        default: '["3.13"]'
        type: string
      gcc-version:
        description: >-
          GCC major version to install (gcc-N/g++-N) and use as CC/CXX for the
          builds below. This integration workflow ALWAYS builds AstroVIPER --
          either the PR package or a fresh clone -- and AstroVIPER's C++
          extensions require C++23 (GCC >= 14), so this defaults to "14"
          (unlike the per-repo linux template, whose gcc install is opt-in).
          Set to "" to use the runner's default compiler.
        required: false
        default: "14"
        type: string
      ignore-requires-python:
        description: >-
          Temporary: run pip with --ignore-requires-python (via
          PIP_IGNORE_REQUIRES_PYTHON) so a new Python version can be tested
          before the packages have been re-released with a relaxed
          Requires-Python cap. Turn off once they have been.
        required: false
        default: false
        type: boolean
    secrets:
      TESTVIPER_DISPATCH_TOKEN:
        # Only used by the dispatch job (push to main). Optional so pull
        # requests from forks, which receive no secrets, can run the tests.
        required: false

permissions:
  contents: read

jobs:
  test-all:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}

    steps:
      - name: Checkout calling repository (PR version)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GCC ${{ inputs.gcc-version }}
        if: ${{ inputs.gcc-version != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y "gcc-${{ inputs.gcc-version }}" "g++-${{ inputs.gcc-version }}"
          # Make the requested compiler the one CMake/scikit-build-core picks up
          # when AstroVIPER's C++ extensions are built below (env persists to
          # later steps via GITHUB_ENV).
          echo "CC=gcc-${{ inputs.gcc-version }}" >> "$GITHUB_ENV"
          echo "CXX=g++-${{ inputs.gcc-version }}" >> "$GITHUB_ENV"
          "g++-${{ inputs.gcc-version }}" --version

      - name: Ignore Requires-Python caps (temporary)
        if: ${{ inputs.ignore-requires-python }}
        run: |
          echo "::warning::pip is ignoring Requires-Python in this job (ignore-requires-python: true). Remove once the packages are re-released."
          echo "PIP_IGNORE_REQUIRES_PYTHON=1" >> "$GITHUB_ENV"

      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Clone and install ToolVIPER
        env:
          REF: ${{ inputs.toolviper_ref }}
        run: |
          if [ ! -d "../toolviper" ]; then
            ORIGINAL_DIR=$(pwd)
            cd ..
            git clone --branch "$REF" https://github.com/casangi/toolviper.git
            pip install -e toolviper
            cd "$ORIGINAL_DIR"
          fi

      - name: Clone and install XRADIO
        env:
          REF: ${{ inputs.xradio_ref }}
        run: |
          if [ ! -d "../xradio" ]; then
            ORIGINAL_DIR=$(pwd)
            cd ..
            git clone --branch "$REF" https://github.com/casangi/xradio.git
            pip install -e "xradio[all]"
            cd "$ORIGINAL_DIR"
          fi

      - name: Clone and install GraphVIPER
        env:
          REF: ${{ inputs.graphviper_ref }}
        run: |
          if [ ! -d "../graphviper" ]; then
            ORIGINAL_DIR=$(pwd)
            cd ..
            git clone --branch "$REF" https://github.com/casangi/graphviper.git
            pip install -e "graphviper[all]"
            cd "$ORIGINAL_DIR"
          fi

      - name: Clone and install AstroVIPER
        env:
          REF: ${{ inputs.astroviper_ref }}
        run: |
          if [ ! -d "../astroviper" ]; then
            ORIGINAL_DIR=$(pwd)
            cd ..
            git clone --branch "$REF" https://github.com/casangi/astroviper.git
            pip install -e "astroviper[all]"
            cd "$ORIGINAL_DIR"
          fi

      - name: Install PR Package
        run: |
          pip install -e ".[all]"

      - name: Run ToolVIPER tests
        run: |
          if [ "${{ github.repository }}" = "casangi/toolviper" ]; then
            pytest tests
            pytest tests_integration
          else
            pytest ../toolviper/tests
            pytest ../toolviper/tests_integration
          fi

      - name: Run XRADIO tests
        run: |
          if [ "${{ github.repository }}" = "casangi/xradio" ]; then
            pytest tests
          else
            pytest ../xradio/tests
          fi

      - name: Run GraphVIPER tests
        run: |
          if [ "${{ github.repository }}" = "casangi/graphviper" ]; then
            pytest tests
          else
            pytest ../graphviper/tests
          fi

      - name: Run AstroVIPER tests
        run: |
          if [ "${{ github.repository }}" = "casangi/astroviper" ]; then
            pytest tests
          else
            pytest ../astroviper/tests
          fi

  dispatch-integration-tests:
    runs-on: ubuntu-latest
    needs: test-all
    # Only the casangi repositories hold TESTVIPER_DISPATCH_TOKEN; skip in forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'casangi'

    steps:
    - name: Log dispatch attempt
      run: |
        echo "🚀 Preparing to send repository dispatch to testviper..."
        echo "📦 Repository: ${{ github.repository }}"
        echo "🌿 Branch: ${{ github.ref }}"
        echo "🔑 Commit: ${{ github.sha }}"
        echo "👤 Actor: ${{ github.actor }}"
        echo "🆔 Run ID: ${{ github.run_id }}"
        echo "🔢 Run Number: ${{ github.run_number }}"

    - name: Repository Dispatch to testviper
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.TESTVIPER_DISPATCH_TOKEN }}
        script: |
          // Read the run metadata from `context` rather than interpolating
          // workflow expressions into the script source.
          const payload = {
            event_type: 'integration-test-trigger',
            client_payload: {
              repository: `${context.repo.owner}/${context.repo.repo}`,
              ref: context.ref,
              sha: context.sha,
              actor: context.actor,
              workflow: context.workflow,
              run_id: String(context.runId),
              run_number: String(context.runNumber)
            }
          };

          // Send repository dispatch to target repository
          await github.rest.repos.createDispatchEvent({
            owner: 'casangi',
            repo: 'testviper',
            event_type: payload.event_type,
            client_payload: payload.client_payload
          });

          // Note: repository_dispatch is repository-wide and not branch-specific.

          console.log('Repository dispatch sent successfully to testviper');

    - name: Log dispatch success
      run: |
        echo "✅ Repository dispatch sent successfully to testviper!"
        echo "📋 Event type: integration-test-trigger"
        echo "🎯 Target: casangi/testviper (branch: main)"
        echo "📝 Check testviper Actions tab for integration test execution"
