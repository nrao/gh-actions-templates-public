# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions.

name: "Python testing on Linux (template)"

on:
  workflow_call:
    inputs:
      python-versions:
        required: false
        type: string
        default: '["3.11", "3.12", "3.13"]'  
      test-path:
        required: false
        type: string
        default: "tests/"
      cov_project:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ${{ fromJson(inputs.python-versions) }}
    steps:
    - uses: actions/checkout@v4

    - name: Set trace-start
      run: |
        echo "trace-start=$(date +%s)" >> $GITHUB_OUTPUT

    - uses: honeycombio/gha-buildevents@v2
      with:
        apikey: ${{ secrets.BUILDEVENT_APIKEY }}
        dataset: gha-buildevents_integration
        matrix-key: python-version

    - name: Set up Python 3
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies with pip
      run: |
        echo "STEP_ID=pip" >> $GITHUB_ENV
        echo "STEP_START=$(date +%s)" >> $GITHUB_ENV
        buildevents cmd $TRACE_ID $STEP_ID 'self update' -- \
          python -m pip install --upgrade pip
        buildevents cmd $TRACE_ID $STEP_ID 'install package' -- \
          pip install ".[all]"  # install your package
        buildevents step $TRACE_ID $STEP_ID $STEP_START $STEP_ID

    - name: Test with pytest
      run: |
        echo "STEP_ID=pytest" >> $GITHUB_ENV
        echo "STEP_START=$(date +%s)" >> $GITHUB_ENV
        buildevents cmd $TRACE_ID $STEP_ID 'self update' -- \
          pytest -v ${{ inputs.test-path }} \
          --html=test-results.html --self-contained-html \
          --cov=${{ inputs.cov_project }} --no-cov-on-fail \
          --cov-report=html --cov-report=xml --doctest-modules \
          --junitxml=junit.xml -o junit_family=legacy

    - name: Upload pytest test results and coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: pytest-results-${{ matrix.python-version }}
        path: |
          ./test-results.html
          ./htmlcov
      # Use always() to always run this step to publish test results when there are test failures
      if: ${{ always() }}

    # - name: Check CODECOV_TOKEN
    #   run: echo "CODECOV_TOKEN=${{ secrets.CODECOV_TOKEN }}"

    - name: Upload code coverage results to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}  # Use the passed token from workflow_call
        slug: ${{ github.repository }}

    - name: Upload test stats to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: ${{ github.repository }}

    outputs:
      trace-start: ${{ steps.set-trace-start.outputs.trace-start }}

  end-trace:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ always() }}
    permissions:
      actions: read
    steps:
    - uses: technote-space/workflow-conclusion-action@v3
    - uses: honeycombio/gha-buildevents@v2
      with:
        apikey: ${{ secrets.BUILDEVENT_APIKEY }}
        dataset: gha-buildevents_integration
        status: ${{ env.WORKFLOW_CONCLUSION }}
        trace-start: ${{ needs.build.outputs.trace-start}}
        matrix-key: ${{ matrix.python-version }}
